name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: "for f in $(find . -name \"*.php\" -not -path \"./vendor/*\"); do php -l \"$f\" >/dev/null || exit 1; done"
